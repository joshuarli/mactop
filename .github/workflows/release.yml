name: release

on:
  workflow_dispatch:

# Keep write access scoped to the jobs that need it.
permissions: {}

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    # mactop needs Swift 6.4 and the macOS 27 SDK, which only the xcode-27 image has.
    runs-on: xcode-27
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Cache .build
        uses: actions/cache@v6
        with:
          path: .build
          key: build-${{ runner.os }}-${{ hashFiles('Package.swift') }}

      - name: Build
        run: swift build -c release --product mactop

      - name: Package binary
        run: cp .build/release/mactop mactop-aarch64-apple-darwin

      - uses: actions/upload-artifact@v7
        with:
          name: mactop-aarch64-apple-darwin
          path: mactop-aarch64-apple-darwin

  release:
    name: Create pre-release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: mactop-*
          path: dist
          merge-multiple: true

      - name: Zip artifacts
        run: for f in dist/*; do zip -9 --junk-paths "$f.zip" "$f"; done

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: release-${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG"
